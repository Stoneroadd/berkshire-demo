<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050608" />
    <title>Berkshire Hathaway — Noir Concept</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap");
      :root {
        color-scheme: dark;
        font-family: Manrope, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #050608;
        color: white;
        overflow-x: hidden;
      }
      body {
        min-height: 100svh;
      }
      .hero {
        min-height: 100svh;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: #050608;
      }
      .shot {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transform: scale(1.08);
        transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .shot.is-active {
        opacity: 1;
        transform: scale(1.02);
        transition:
          opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1),
          transform 3.2s linear;
      }
      .shot.one {
        background-image: url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1800&q=85");
      }
      .shot.two {
        background-image: url("https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1800&q=85");
      }
      .shot.three {
        background-image: url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1800&q=85");
      }
      .hero:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(
            90deg,
            rgba(1, 3, 7, 0.84) 0%,
            rgba(1, 3, 7, 0.48) 52%,
            rgba(1, 3, 7, 0.12)
          ),
          linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.86),
            transparent 48%,
            rgba(0, 0, 0, 0.42)
          );
        pointer-events: none;
      }
      .grain {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.18;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
      }
      .shell {
        position: relative;
        z-index: 3;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        padding: clamp(22px, 4vw, 58px) clamp(22px, 6vw, 100px) 26px;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .brand {
        font-size: clamp(14px, 1.5vw, 21px);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      .brand span {
        display: block;
        font-weight: 500;
        letter-spacing: 0.24em;
        font-size: 9px;
        margin-top: 7px;
        color: #a8b0bc;
      }
      .nav-right {
        appearance: none;
        border: 0;
        background: transparent;
        padding: 8px 0;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #e7eaf0;
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.17em;
        cursor: pointer;
      }
      .nav-right:focus-visible {
        outline: 1px solid #e9f1f1;
        outline-offset: 6px;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: #c8e8d8;
        border-radius: 50%;
        transition: background 0.2s;
      }
      .hero:not(.motion-enabled) .dot {
        background: #8d969f;
      }
      .main {
        margin: auto 0;
        max-width: 950px;
        padding: 70px 0 58px;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.35em;
        color: #c6d0da;
        display: flex;
        align-items: center;
        gap: 16px;
        opacity: 0;
        animation: rise 0.7s 0.35s forwards;
      }
      .eyebrow:before {
        content: "";
        width: 36px;
        height: 1px;
        background: #dce4e9;
      }
      h1 {
        font-size: clamp(58px, 11vw, 96px);
        line-height: 0.89;
        letter-spacing: -0.04em;
        font-weight: 600;
        margin: 27px 0 28px;
        max-width: 1100px;
      }
      h1 span {
        display: block;
        opacity: 0;
        transform: translateY(32px);
        animation: rise 0.7s 0.55s forwards;
      }
      h1 span:nth-child(2) {
        animation-delay: 0.8s;
        color: #d5e0e7;
      }
      .intro {
        font-family: "DM Sans", sans-serif;
        font-size: clamp(13px, 1.5vw, 17px);
        line-height: 1.7;
        color: #c4cbd3;
        max-width: 490px;
        opacity: 0;
        animation: rise 0.7s 1.05s forwards;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 25px;
        margin-top: 32px;
        opacity: 0;
        animation: rise 0.7s 1.35s forwards;
      }
      .cta {
        color: #101417;
        background: #e9f1f1;
        padding: 15px 21px;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 0.07em;
        font-weight: 800;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .cta:hover {
        background: white;
        transform: translateY(-2px);
      }
      .secondary {
        color: white;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 0.09em;
        border-bottom: 1px solid #ffffff80;
        padding-bottom: 7px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 18px;
        border-top: 1px solid #ffffff40;
        padding-top: 20px;
      }
      .footer small {
        font-size: 9px;
        letter-spacing: 0.18em;
        color: #b8c2cc;
      }
      .stats {
        display: flex;
        gap: clamp(20px, 5vw, 75px);
      }
      .stat strong {
        font-size: clamp(17px, 2.3vw, 30px);
        font-weight: 600;
        letter-spacing: -0.04em;
        display: block;
      }
      .stat label {
        display: block;
        font-size: 9px;
        color: #aebbc6;
        letter-spacing: 0.16em;
        margin-top: 7px;
      }
      .wipe {
        position: absolute;
        z-index: 5;
        inset: 0;
        background: #e8eff0;
        transform: translateX(-101%);
        pointer-events: none;
        will-change: transform;
      }
      .progress {
        position: absolute;
        z-index: 6;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: #d9e7e6;
        transform: scaleX(0);
        transform-origin: left;
        will-change: transform;
      }
      .frame {
        position: absolute;
        inset: 14px;
        z-index: 2;
        border: 1px solid rgba(255, 255, 255, 0.13);
        pointer-events: none;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 650px) {
        .shell {
          padding: 26px 25px 26px;
        }
        .frame {
          inset: 9px;
        }
        .nav-right {
          gap: 7px;
          font-size: 8px;
          letter-spacing: 0.1em;
          white-space: nowrap;
        }
        .main {
          padding: 80px 0 48px;
        }
        h1 {
          font-size: clamp(46px, 13vw, 68px);
          margin: 25px 0;
        }
        .hero:before {
          background:
            linear-gradient(90deg, rgba(1, 3, 7, 0.76), rgba(1, 3, 7, 0.25)),
            linear-gradient(
              0deg,
              rgba(0, 0, 0, 0.88),
              transparent 65%,
              rgba(0, 0, 0, 0.35)
            );
        }
        .shot {
          background-position: 55% center;
        }
        .footer {
          align-items: start;
          flex-direction: column;
          gap: 25px;
        }
        .stats {
          width: 100%;
          justify-content: space-between;
          gap: 10px;
        }
        .stat label {
          font-size: 8px;
        }
        .intro {
          max-width: 310px;
        }
        .actions {
          gap: 17px;
          flex-wrap: wrap;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero:not(.motion-enabled) .shot {
          opacity: 0;
          transform: none;
          transition: none;
        }
        .hero:not(.motion-enabled) .shot.three {
          opacity: 1;
        }
        .hero:not(.motion-enabled) .wipe,
        .hero:not(.motion-enabled) .progress {
          display: none;
        }
        .hero:not(.motion-enabled) .eyebrow,
        .hero:not(.motion-enabled) h1 span,
        .hero:not(.motion-enabled) .intro,
        .hero:not(.motion-enabled) .actions {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <div class="shot one is-active"></div>
      <div class="shot two"></div>
      <div class="shot three"></div>
      <div class="grain"></div>
      <div class="frame"></div>
      <div class="wipe"></div>
      <div class="progress"></div>
      <div class="shell">
        <header class="nav">
          <div class="brand">BERKSHIRE<br />HATHAWAY<span>EST. 1839</span></div>
          <button
            class="nav-right"
            type="button"
            aria-pressed="true"
            aria-label="Pause background motion"
          >
            <span class="dot"></span
            ><span class="motion-label">PAUSE MOTION</span>
          </button>
        </header>
        <section class="main">
          <div class="eyebrow">BUILT ON CONVICTION</div>
          <h1><span>Value.</span><span>Beyond time.</span></h1>
          <p class="intro">
            A legacy of disciplined investing, enduring businesses, and
            decisions made for the long term.
          </p>
          <div class="actions">
            <a
              class="cta"
              href="https://www.berkshirehathaway.com/"
              target="_blank"
              rel="noopener"
              >EXPLORE BERKSHIRE ↗</a
            ><a
              class="secondary"
              href="https://www.berkshirehathaway.com/reports.html"
              target="_blank"
              rel="noopener"
              >ANNUAL REPORTS</a
            >
          </div>
        </section>
        <footer class="footer">
          <small>INDEPENDENT DESIGN CONCEPT · NOT AN OFFICIAL WEBSITE</small>
          <div class="stats">
            <div class="stat"><strong>01</strong><label>DISCIPLINE</label></div>
            <div class="stat">
              <strong>02</strong><label>STEWARDSHIP</label>
            </div>
            <div class="stat"><strong>03</strong><label>LONGEVITY</label></div>
          </div>
        </footer>
      </div>
    </main>
    <script>
      (() => {
        const hero = document.querySelector(".hero");
        const shots = [...document.querySelectorAll(".shot")];
        const wipe = document.querySelector(".wipe");
        const progress = document.querySelector(".progress");
        const toggle = document.querySelector(".nav-right");
        const label = document.querySelector(".motion-label");
        const reduce = matchMedia("(prefers-reduced-motion: reduce)");
        const forceMotion = new URLSearchParams(location.search).has("motion");
        const sceneDuration = 3200;
        let active = 0;
        let timer;
        let motionEnabled = forceMotion || !reduce.matches;
        let wipeAnimation;
        let progressAnimation;
        const animateAccents = () => {
          wipeAnimation?.cancel();
          progressAnimation?.cancel();
          wipeAnimation = wipe.animate(
            [
              { transform: "translateX(-101%)" },
              { transform: "translateX(101%)" },
            ],
            { duration: 200, easing: "cubic-bezier(.16,1,.3,1)" },
          );
          progressAnimation = progress.animate(
            [{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }],
            { duration: sceneDuration, easing: "linear" },
          );
        };
        const show = (index, animate = true) => {
          active = index;
          shots.forEach((shot, i) =>
            shot.classList.toggle("is-active", i === active),
          );
          if (animate) animateAccents();
        };
        const schedule = () => {
          clearTimeout(timer);
          if (!motionEnabled || document.hidden) return;
          timer = setTimeout(() => {
            show((active + 1) % shots.length);
            schedule();
          }, sceneDuration);
        };
        const renderControl = () => {
          hero.classList.toggle("motion-enabled", motionEnabled);
          toggle.setAttribute("aria-pressed", String(motionEnabled));
          toggle.setAttribute(
            "aria-label",
            motionEnabled
              ? "Pause background motion"
              : "Play background motion",
          );
          label.textContent = motionEnabled ? "PAUSE MOTION" : "PLAY MOTION";
        };
        const setMotion = (enabled) => {
          motionEnabled = enabled;
          clearTimeout(timer);
          wipeAnimation?.cancel();
          progressAnimation?.cancel();
          renderControl();
          if (motionEnabled) {
            animateAccents();
            schedule();
          }
        };
        toggle.addEventListener("click", () => setMotion(!motionEnabled));
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            clearTimeout(timer);
            progressAnimation?.pause();
          } else if (motionEnabled) {
            progressAnimation?.play();
            schedule();
          }
        });
        reduce.addEventListener("change", (event) => {
          if (!forceMotion) setMotion(!event.matches);
        });
        renderControl();
        if (motionEnabled) {
          animateAccents();
          schedule();
        } else {
          show(2, false);
        }
      })();
    </script>
  </body>
</html>
